name: Bump theme version

# Runs on push to any branch EXCEPT main — deliberate, so new client
# branches never need this file edited to be brought under
# auto-versioning (push-triggered workflows only run using the copy of
# this file that already exists on the branch being pushed to, so a
# "main only" list wouldn't apply to a freshly created branch anyway).
# main is excluded on purpose: it's pinned at 1.0.0 permanently, since
# it's the shared base branch new client branches are cut from, not a
# site anything tracks in production. See CLAUDE.md before changing
# this back to an explicit branch list or including main.
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-patch-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip version bump]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version in style.css
        id: bump
        run: |
          set -euo pipefail

          FILE="style.css"
          CURRENT=$(grep -m1 -oP '^\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' "$FILE")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"

          sed -i -E "s/^(\s*Version:\s*)$CURRENT\$/\1$NEW/" "$FILE"

          echo "old=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.old != steps.bump.outputs.new
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "chore: bump version ${{ steps.bump.outputs.old }} -> ${{ steps.bump.outputs.new }} [skip version bump]"
          git push origin HEAD:${{ github.ref_name }}
