<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" fill="none" role="img" aria-label="DigitalDrum Networks">
	<!-- Icon: badge with a drum + network node motif -->
	<rect x="2" y="2" width="56" height="56" rx="12" fill="#0B1F3A"/>

	<!-- Network branches -->
	<g stroke="#1D6FE0" stroke-width="2.2" stroke-linecap="round">
		<path d="M30 19 L30 8"/>
		<path d="M30 19 L17 12"/>
		<path d="M30 19 L43 12"/>
	</g>
	<g fill="#4C93F2">
		<circle cx="30" cy="8" r="2.8"/>
		<circle cx="17" cy="12" r="2.8"/>
		<circle cx="43" cy="12" r="2.8"/>
	</g>

	<!-- Drum body -->
	<path d="M16 23 L44 23 L38 48 L22 48 Z" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"/>
	<ellipse cx="30" cy="23" rx="14" ry="4.5" fill="#FFFFFF"/>
	<path d="M21 29 L25 46 M30 25 L30 48 M39 29 L35 46" stroke="#0B1F3A" stroke-width="1.6" stroke-linecap="round"/>

	<!-- Wordmark -->
	<text x="72" y="30" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">DigitalDrum</text>
	<text x="72" y="49" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#4C93F2">NETWORKS</text>
</svg>
